# Alembic configuration.
#
# Deliberately contains no database URL. `sqlalchemy.url` is left empty and
# migrations/env.py supplies it from app.core.config, which reads the
# environment. A URL here would be a password in a committed file.

[alembic]
script_location = migrations

# Revision filenames sort chronologically in a directory listing, which the
# bare hash does not. Produces e.g. 20261108_1a2b3c4d5e6f_initial_schema.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Makes `app` importable when alembic runs from the project root.
prepend_sys_path = .

# Timestamps in revision files are UTC, so they mean the same thing to every
# developer and to CI.
timezone = UTC

# Supplied by migrations/env.py. Do not fill this in.
sqlalchemy.url =


# Alembic's own logging. The application's JSON logging is not used here:
# migrations are an operator-facing batch job, and plain text is easier to read
# in a terminal and in a CI log.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
